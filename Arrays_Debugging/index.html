        //nested loops

        //FIX THIS SO IT DOESN'T DISPLAY THE ALERT WITHOUT CLEARING IT FIRST;


        //initialize
        let asCustomer = new Array(3);
        let asPurchase = new Array(3);

        //loop through the outer array 3 times
        for (let iOuter = 0; iOuter < 3; iOuter++)
        {

            //initialize alert variable for the inner loop
            let sPurchaseOutput = "";
            
            //ask for input on the cust name in the outer loop
            asCustomer[iOuter] = prompt("Cust name pls: ");

            //for the number of customer we're currently on, make a sub-array
            //the two arrays are linked by the same index!!
            asPurchase[iOuter] = new Array(3);




            //for each item of the sub-array, loop through 
            for (let iInner = 0; iInner <3; iInner++)
            {
                //keep track of which outer item we're on and loop through the inner items
                asPurchase[iOuter][iInner] = prompt("Purchase was... ");

                asPurchase.forEach(function(sOnePurchase)
                {
                    sPurchaseOutput = sPurchaseOutput + sOnePurchase
                })
                
            }

            alert(`The cust named ${asCustomer[iOuter]} purchased: ${sPurchaseOutput}`);
