        // This is an example of an object containing an object
        class Athlete
        {
            constructor(name, sport, record, height, happy_score)
            {
                this.name = name;
                this.sport = sport;
                this.record = record;
                this.height = height;
                this.happy_score = happy_score;
            }

            display_info()
            {
                return this.name + "'s record is: " + this.record + " , his/her height is " + this.height + 
                    " and his/her happiness level is: " + this.happy_score + "."
            }
        }

        // the workout object gets info from the athlete object
