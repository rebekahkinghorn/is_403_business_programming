<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1>Find Your Pet at the Cheesy Pet Market</h1>
    <form id="petForm">
    <br>
        <fieldset>
            <legend>Let's match you with the pet of your cheesy dreams! </legend>
            <br>

            <label for="petType">Pick Your Poison: </label>
            <br>
            
            <input type="radio" id="cat" name="petType" value="Cat" checked>
            <label>Cat</label>
            <br>

            <input type="radio" id="dog" name="petType" value="Dog">
            <label>Dog</label>
            <br>

            <input type="radio" id="rabbit" name="petType" value="Rabbit">
            <label>Rabbit</label>
            <br>
            <br>


            <label for="livingSpace">Your dwelling (will it be suitable for any of these small vermin?): </label>
            <br>
            
            <input type="radio" id="house_with_yard" name="livingSpace" value="House with Yard" checked>
            <label>House with Yard</label>
            <br>

            <input type="radio" id="apartment" name="livingSpace" value="Apartment">
            <label>Apartment</label>
            <br>

            <input type="radio" id="farm" name="livingSpace" value="Farm">
            <label>Farm</label>
            <br>
            <br>

            
            <button id="submitButton" type="submit" onclick="processCheese(event)">Submit CheeseForm</button>

        </fieldset>

        <h1>Your Cheese Pet is...</h1>
        <p id="cheesePetChosen"></p>
    </form>


    <script>

        //an array with just pet names

        const aPets = new Array(8);

        aPets[7][3] = "A bold outdoor cat who loves hunting in open fields";





        function processCheese(event)
        {

            //stop page from reloading
            event.preventDefault();

            
            //define radio buttons for pet selection
            const radios = document.querySelectorAll(
                'input[name="petType"]'
            )

            //loop through button and see what pet they clicked
            for (let iCount = 0; iCount<radios.length; iCount++)
            {
                if (radios[iCount].checked)
                {
                    selectedValue = radios[iCount].value;
                    break;
                }
            }

            //define radio buttons for house type
            const houseRadios = document.querySelectorAll(
                'input[name="livingSpace"]'
            )

            //loop through buttons and see what house they clicked 
            for (let iCounter = 0; iCounter<radios.length; iCounter++)
            {
                if (houseRadios[iCounter].checked)
                {
                    houseValue = houseRadios[iCounter].value;
                    break;
                }
            }

            //check and make sure we got what they clicked
            // alert(selectedValue);
            // alert(houseValue);


            //initialize booelan vars
            let petMatch = false;
            let houseMatch = false;

            
            //store matches in this array
            let aMatch = [];


            //loop through and see if they match the pets and housing
            for (let iNum = 0; iNum < 8; iNum++)
            {
                if (selectedValue == aPets[iNum][1])
                {
                    if(houseValue == aPets[iNum][2])
                    {
                        aMatch.push(aPets[iNum][0], aPets[iNum][3]);
                    }
                }
            }

            //display the match name!!
            // alert(aMatch);
        
            let sPetOutput = ""

            aMatch.forEach(function(pet)
            {
                // aMatch[] 
                sPetOutput = sPetOutput + "<br>" + " - " + pet
            })

            //show pets matched with
            document.getElementById("cheesePetChosen").innerHTML = sPetOutput;

        }


    </script>
